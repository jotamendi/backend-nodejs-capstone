apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondchanceapp
  labels:
    app: secondchanceapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secondchanceapp
  template:
    metadata:
      labels:
        app: secondchanceapp
    spec:
      containers:
      - name: secondchanceapp-container
        image: us.icr.io/sn-labs-joaquin9815/secondchanceapp 
        ports:
        - containerPort: 3060
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      imagePullSecrets:
      - name: icr
---
apiVersion: v1
kind: Service
metadata:
  name: secondchance-app-service
spec:
  type: NodePort
  selector:
    app: secondchanceapp
  ports:
  - port: 80
    targetPort: 3060
    protocol: TCP
